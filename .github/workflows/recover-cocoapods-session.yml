name: Recover CocoaPods Trunk session and publish

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5
        with:
          ref: v0.1.1

      - name: Register a temporary Trunk session
        run: >-
          pod trunk register 'jiankn@gmail.com' 'Jacky Jian'
          --description='SavePinner GitHub Actions release'

      - name: Wait for email verification
        shell: bash
        run: |
          for attempt in {1..60}; do
            if pod trunk me >/dev/null 2>&1; then
              echo "CocoaPods Trunk session verified."
              exit 0
            fi
            sleep 15
          done
          echo "Timed out waiting for CocoaPods Trunk email verification." >&2
          exit 1

      - name: Revoke prior Trunk sessions
        run: pod trunk me clean --all

      - name: Publish to CocoaPods Trunk
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if pod trunk push PinterestURLNormalizer.podspec; then
              exit 0
            fi

            if curl --fail --silent --show-error \
              https://trunk.cocoapods.org/api/v1/pods/PinterestURLNormalizer \
              | ruby -rjson -e 'exit(JSON.parse(STDIN.read).fetch("versions").any? { |version| version.fetch("name") == "0.1.1" } ? 0 : 1)'; then
              echo "PinterestURLNormalizer 0.1.1 is already public."
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              sleep 30
            fi
          done
          exit 1
